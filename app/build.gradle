plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.example.callshield'
    compileSdk 34
    defaultConfig {
        applicationId "com.example.callshield"
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName "3.0-214"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
}
